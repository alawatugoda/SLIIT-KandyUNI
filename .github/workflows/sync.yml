name: Sync OpenAlex Publications

on:
  schedule:
      - cron: '30 20 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Sync from OpenAlex
        run: python3 sync_openalex.py
      - name: Commit changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add research/data/members.json research/data/sync_meta.json
          git diff --staged --quiet || git commit -m "Auto-sync OpenAlex data [$(date -u +%Y-%m-%d)]"
          git push
